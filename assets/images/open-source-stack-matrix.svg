<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="100%" height="100%" role="img" aria-label="Open Source Energy Stack Matrix">
  <rect width="960" height="200" rx="16" fill="#4551BF"/>
  <text x="32" y="34" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">OPEN SOURCE ENERGY STACK MATRIX</text>
  <line x1="32" y1="46" x2="928" y2="46" stroke="#C7CCF2" stroke-opacity="0.3" stroke-width="1"/>

  <!-- header row -->
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#8892E0" letter-spacing="0.8">
    <text x="48" y="72">LIBRARY / PROJECT</text>
    <text x="260" y="72">ABSTRACTION</text>
    <text x="470" y="72">DOMAIN FOCUS</text>
    <text x="660" y="72">PRIMARY ROLE</text>
  </g>
  <line x1="32" y1="80" x2="928" y2="80" stroke="#C7CCF2" stroke-opacity="0.35" stroke-width="1"/>

  <!-- rows -->
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
    <text x="48" y="102">ODS-E (ona)</text>
    <text x="260" y="102" fill="#C7CCF2">Asset-Level</text>
    <text x="470" y="102" fill="#C7CCF2">Data Substrate</text>
    <text x="660" y="102" fill="#C7CCF2">Normalization / ETL</text>
  </g>
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">
    <text x="48" y="124">pvlib-python</text>
    <text x="260" y="124" fill="#C7CCF2">Asset-Level</text>
    <text x="470" y="124" fill="#C7CCF2">Solar (PV)</text>
    <text x="660" y="124" fill="#C7CCF2">Physical Modeling</text>
  </g>
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">
    <text x="48" y="146">OpenOA (NREL)</text>
    <text x="260" y="146" fill="#C7CCF2">Asset / Plant</text>
    <text x="470" y="146" fill="#C7CCF2">Wind Generation</text>
    <text x="660" y="146" fill="#C7CCF2">Operational Audits</text>
  </g>
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">
