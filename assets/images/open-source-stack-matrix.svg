  </g>
  <g font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">
    <text x="48" y="190">PowerAgent</text>
    <text x="260" y="190" fill="#C7CCF2">Fleet / Control</text>
    <text x="470" y="190" fill="#C7CCF2">Agentic AI</text>
    <text x="660" y="190" fill="#C7CCF2">Autonomous Ops</text>
  </g>
  <line x1="32" y1="110" x2="928" y2="110" stroke="#C7CCF2" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="32" y1="132" x2="928" y2="132" stroke="#C7CCF2" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="32" y1="154" x2="928" y2="154" stroke="#C7CCF2" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="32" y1="176" x2="928" y2="176" stroke="#C7CCF2" stroke-opacity="0.12" stroke-width="1"/>
