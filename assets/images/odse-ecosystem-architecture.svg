<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .title { font: 700 26px "DM Sans", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "DM Sans", sans-serif; fill: #475569; }
      .section-hdr { font: 700 13px "JetBrains Mono", monospace; fill: #64748b; letter-spacing: 1.5px; text-transform: uppercase; }
      .label { font: 600 17px "DM Sans", sans-serif; fill: #0f172a; }
      .text  { font: 400 14px "DM Sans", sans-serif; fill: #334155; }
      .bold  { font: 600 14px "DM Sans", sans-serif; fill: #0f172a; }
      .muted { font: 400 13px "DM Sans", sans-serif; fill: #64748b; }
      .badge { font: 600 11px "JetBrains Mono", monospace; }
      
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .box-hover:hover { stroke: #0284c7; stroke-width: 2; }
      .boxCenter { fill: #0f172a; stroke: #38bdf8; stroke-width: 2.5; rx: 18; filter: drop-shadow(0 10px 25px rgba(15,23,42,0.18)); }
      .boxLeft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .boxRight { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .pill { fill: #e2e8f0; rx: 12; }
      .pill-solar { fill: #fef3c7; }
      .pill-wind { fill: #e0f2fe; }
      .pill-grid { fill: #ede9fe; }
      .pill-ai { fill: #fce7f3; }
      
      .arrow { stroke: #0f172a; stroke-width: 2; fill: none; }
      .arrow-blue { stroke: #0284c7; stroke-width: 2.5; fill: none; }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2.5; fill: none; }
      .arrow-emerald { stroke: #059669; stroke-width: 2.5; fill: none; }
      .arrow-pink { stroke: #db2777; stroke-width: 2.5; fill: none; }
      .dash { stroke-dasharray: 6 6; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrowHeadEmerald" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowHeadPink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#db2777"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="960" fill="#fafafa"/>

  <!-- Header -->
  <text x="60" y="55" class="title">ODS-E in the Open Source Energy Ecosystem</text>
  <text x="60" y="82" class="subtitle">Solving the physical ingest bottleneck: Normalizing raw asset telemetry to power modeling, grid simulation, and agentic AI</text>

  <!-- COLUMN 1: UPSTREAM EDGE INGEST (Raw Fragmentation) -->
  <g transform="translate(60, 110)">
    <text x="0" y="18" class="section-hdr">LAYER 1: RAW ASSET TELEMETRY (EDGE / SCADA)</text>
    <text x="0" y="38" class="muted">Proprietary protocols, inconsistent units, drift, and missing timestamps</text>

    <!-- Solar Inverters -->
    <rect x="0" y="55" width="260" height="130" class="boxLeft"/>
    <rect x="15" y="70" width="85" height="22" class="pill pill-solar"/>
    <text x="57" y="85" text-anchor="middle" class="badge" fill="#92400e">SOLAR OEM</text>
    <text x="15" y="115" class="label">Solar Inverters &amp; Loggers</text>
    <text x="15" y="140" class="text">Huawei, Enphase, Solarman,</text>
    <text x="15" y="160" class="muted">SMA, Sungrow (kW vs W, mixed tz)</text>

    <!-- Wind Turbines -->
    <rect x="0" y="210" width="260" height="130" class="boxLeft"/>
    <rect x="15" y="225" width="80" height="22" class="pill pill-wind"/>
    <text x="55" y="240" text-anchor="middle" class="badge" fill="#0369a1">WIND OEM</text>
    <text x="15" y="270" class="label">Wind Turbine SCADA</text>
    <text x="15" y="295" class="text">Vestas, Siemens Gamesa,</text>
    <text x="15" y="315" class="muted">Nordex (Pitch, yaw, anemometer)</text>

    <!-- Utility & Meters -->
    <rect x="0" y="365" width="260" height="130" class="boxLeft"/>
    <rect x="15" y="380" width="100" height="22" class="pill pill-grid"/>
    <text x="65" y="395" text-anchor="middle" class="badge" fill="#6b21a8">UTILITY METER</text>
    <text x="15" y="425" class="label">Revenue &amp; AMR Loggers</text>
    <text x="15" y="450" class="text">Eskom AMR, MV90, SCL, IEC 61850,</text>
    <text x="15" y="470" class="muted">Terraco Historian, Modbus/OPC-UA</text>

    <!-- BESS / Storage -->
    <rect x="0" y="520" width="260" height="130" class="boxLeft"/>
    <rect x="15" y="535" width="60" height="22" class="pill" fill="#e2e8f0"/>
    <text x="45" y="550" text-anchor="middle" class="badge" fill="#334155">STORAGE</text>
    <text x="15" y="580" class="label">BESS &amp; Microgrids</text>
    <text x="15" y="605" class="text">BYD BatteryBox, Sungrow PowerTitan,</text>
    <text x="15" y="625" class="muted">Cell voltages, SoC, dispatch modes</text>

    <!-- Bottom summary box -->
    <rect x="0" y="675" width="260" height="90" class="box" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="15" y="702" class="bold" fill="#9f1239">The Core Pain Point:</text>
    <text x="15" y="724" class="text" fill="#881337">Scientific models and AI agents fail</text>
    <text x="15" y="744" class="text" fill="#881337">when 80% of effort is data cleaning.</text>
  </g>

  <!-- ARROWS FROM INGEST INTO CENTRAL ODS-E HUB -->
  <path d="M320 230 C360 230, 370 420, 420 450" class="arrow dash" marker-end="url(#arrowHead)"/>
  <path d="M320 385 C370 385, 380 470, 420 485" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M320 540 C370 540, 380 505, 420 515" class="arrow" marker-end="url(#arrowHead)"/>
  <path d="M320 695 C360 695, 370 570, 420 545" class="arrow dash" marker-end="url(#arrowHead)"/>

  <!-- CENTER: ODS-E HUB -->
  <g transform="translate(430, 240)">
    <rect x="0" y="0" width="370" height="500" class="boxCenter"/>
    
    <text x="185" y="42" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="700" font-size="22px" fill="#ffffff">ODS-E PROTOCOL HUB</text>
    <text x="185" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12px" fill="#38bdf8">CENTRAL NORMALIZATION LAYER</text>

    <!-- Core Capabilities Pills/Boxes inside hub -->
    <rect x="25" y="95" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="122" font-family="'DM Sans', sans-serif" font-weight="600" font-size="15px" fill="#f8fafc">1. Declarative YAML Transforms</text>
    <text x="40" y="145" font-family="'DM Sans', sans-serif" font-size="13px" fill="#94a3b8">Converts OEM schemas &amp; tag hierarchies</text>

    <rect x="25" y="178" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="205" font-family="'DM Sans', sans-serif" font-weight="600" font-size="15px" fill="#f8fafc">2. Strict Temporal Normalization</text>
    <text x="40" y="228" font-family="'DM Sans', sans-serif" font-size="13px" fill="#94a3b8">Enforces UTC DatetimeIndex &amp; ISO-8601</text>

    <rect x="25" y="261" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="288" font-family="'DM Sans', sans-serif" font-weight="600" font-size="15px" fill="#f8fafc">3. Universal Error Taxonomy</text>
    <text x="40" y="311" font-family="'DM Sans', sans-serif" font-size="13px" fill="#94a3b8">Normalizes vendor alarms into standard faults</text>

    <rect x="25" y="344" width="320" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="371" font-family="'DM Sans', sans-serif" font-weight="600" font-size="15px" fill="#f8fafc">4. Bidirectional Adapters &amp; MCP</text>
    <text x="40" y="394" font-family="'DM Sans', sans-serif" font-size="13px" fill="#94a3b8">Zero-drift Python adapters + MCP Server</text>

    <!-- Hub Summary badge -->
    <rect x="25" y="430" width="320" height="46" rx="8" fill="#0284c7"/>
    <text x="185" y="458" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="700" font-size="13px" fill="#ffffff">CANONICAL ASSET-LEVEL INTEROPERABILITY</text>
  </g>

  <!-- ARROWS FROM ODS-E HUB TO DOWNSTREAM ECOSYSTEM -->
  <!-- To pvlib -->
  <path d="M800 320 C850 320, 870 200, 920 180" class="arrow-emerald" marker-end="url(#arrowHeadEmerald)"/>
  <!-- To openoa -->
  <path d="M800 410 C850 410, 870 360, 920 345" class="arrow-blue" marker-end="url(#arrowHeadBlue)"/>
  <!-- To NREL / Grid -->
  <path d="M800 500 C850 500, 870 520, 920 520" class="arrow-purple" marker-end="url(#arrowHeadPurple)"/>
  <!-- To PowerAgent / AI -->
  <path d="M800 620 C850 620, 870 680, 920 700" class="arrow-pink" marker-end="url(#arrowHeadPink)"/>

  <!-- COLUMN 3: DOWNSTREAM OPEN SOURCE ECOSYSTEM -->
  <g transform="translate(930, 110)">
    <text x="0" y="18" class="section-hdr">LAYER 2: OPEN SOURCE ECOSYSTEM RECIPIENTS</text>
    <text x="0" y="38" class="muted">Specialized analytical, physical modeling, grid simulation, and agentic tools</text>

    <!-- Card 1: pvlib -->
    <rect x="0" y="55" width="450" height="145" class="box box-hover"/>
    <rect x="15" y="70" width="135" height="22" class="pill" fill="#d1fae5"/>
    <text x="82" y="85" text-anchor="middle" class="badge" fill="#065f46">ASSET • PRODUCTION</text>
    <text x="15" y="115" class="label">pvlib-python (Sandia / PVPMC)</text>
    <text x="15" y="137" class="text"><tspan class="bold">Business Case:</tspan> Photovoltaic physics, transposition, cell temp, PR.</text>
    <text x="15" y="157" class="text"><tspan class="bold">ODS-E Feed:</tspan> Direct via <tspan font-family="'JetBrains Mono', monospace">odse.adapters.pvlib</tspan> (<tspan font-family="'JetBrains Mono', monospace">odse_to_pvlib</tspan>).</text>
    <text x="15" y="177" class="muted">Abstraction: Solar asset-level • Physics simulation &amp; performance validation</text>

    <!-- Card 2: OpenOA -->
    <rect x="0" y="220" width="450" height="145" class="box box-hover"/>
    <rect x="15" y="235" width="135" height="22" class="pill" fill="#e0f2fe"/>
    <text x="82" y="250" text-anchor="middle" class="badge" fill="#0369a1">ASSET • PERFORMANCE</text>
    <text x="15" y="280" class="label">OpenOA (NREL Operational Assessment)</text>
    <text x="15" y="302" class="text"><tspan class="bold">Business Case:</tspan> Wind operational yield, AEP, wake loss, yaw analysis.</text>
    <text x="15" y="322" class="text"><tspan class="bold">ODS-E Feed:</tspan> Direct via <tspan font-family="'JetBrains Mono', monospace">odse.adapters.openoa</tspan> (<tspan font-family="'JetBrains Mono', monospace">odse_to_openoa</tspan>).</text>
    <text x="15" y="342" class="muted">Abstraction: Wind plant/asset-level • Operational performance &amp; loss audits</text>

    <!-- Card 3: NREL Grid Tools -->
    <rect x="0" y="385" width="450" height="155" class="box box-hover"/>
    <rect x="15" y="400" width="155" height="22" class="pill" fill="#ede9fe"/>
    <text x="92" y="415" text-anchor="middle" class="badge" fill="#6b21a8">GRID • MACRO MODELING</text>
    <text x="15" y="445" class="label">NREL Grid Ecosystem (SAM, ComStock, ResStock)</text>
    <text x="15" y="467" class="text"><tspan class="bold">Business Case:</tspan> Building energy benchmarking, grid load, tariff modeling.</text>
    <text x="15" y="487" class="text"><tspan class="bold">ODS-E Feed:</tspan> Hourly interval baselines &amp; municipal benchmarking profiles.</text>
    <text x="15" y="507" class="muted">Abstraction: Distribution / Regional grid level • Long-term techno-economic planning</text>

    <!-- Card 4: PowerAgent & LLM AI -->
    <rect x="0" y="560" width="450" height="155" class="box box-hover"/>
    <rect x="15" y="575" width="145" height="22" class="pill" fill="#fce7f3"/>
    <text x="87" y="590" text-anchor="middle" class="badge" fill="#9d174d">AUTONOMOUS • AGENTS</text>
    <text x="15" y="620" class="label">PowerAgent (Harvard SEAS / PowerAI)</text>
    <text x="15" y="642" class="text"><tspan class="bold">Business Case:</tspan> Agentic AI workflows, grid reasoning, automated dispatch.</text>
    <text x="15" y="662" class="text"><tspan class="bold">ODS-E Feed:</tspan> Model Context Protocol (<tspan font-family="'JetBrains Mono', monospace">@asobacloud/odse-mcp</tspan>) live grounding.</text>
    <text x="15" y="682" class="muted">Abstraction: Fleet &amp; Control room level • Real-time autonomous decisions</text>

    <!-- Card 5: Bottom ecosystem summary -->
    <rect x="0" y="735" width="450" height="50" class="pill" fill="#f1f5f9"/>
    <text x="225" y="766" text-anchor="middle" class="text" fill="#334155"><tspan class="bold">Synergy:</tspan> ODS-E handles dirty ingest so downstream tools focus on physics and AI.</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(60, 890)">
    <rect x="0" y="0" width="1320" height="45" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="28" class="section-hdr">CROSS-CUTTING ECOSYSTEM DIMENSIONS:</text>
    
    <circle cx="360" cy="22" r="5" fill="#059669"/>
    <text x="375" y="27" class="muted">Asset Physics (pvlib, OpenOA)</text>

    <circle cx="590" cy="22" r="5" fill="#7c3aed"/>
    <text x="605" y="27" class="muted">Grid &amp; Stock Modeling (SAM, ComStock)</text>

    <circle cx="890" cy="22" r="5" fill="#db2777"/>
    <text x="905" y="27" class="muted">AI Reasoning &amp; VPPs (PowerAgent, MCP)</text>

    <text x="1295" y="27" text-anchor="end" class="bold" fill="#0284c7">ODS-E: The Universal Data Substrate</text>
  </g>
</svg>
