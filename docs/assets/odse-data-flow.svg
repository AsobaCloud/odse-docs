<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" role="img" aria-label="ODS-E pipeline data flow: Raw Source, Transform, Validate, Enrich, Output">
  <!-- Main Background Container -->
  <rect width="960" height="300" rx="16" fill="#4551BF"/>

  <!-- Header Block -->
  <text x="32" y="34" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">ODS-E DATA FLOW</text>
  <text x="32" y="50" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#C7CCF2" letter-spacing="0.5">Every ODS-E pipeline follows the same composable pattern</text>
  <line x1="32" y1="60" x2="928" y2="60" stroke="#C7CCF2" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Connectors between cards -->
  <g stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3">
    <line x1="196" y1="160" x2="216" y2="160"/>
    <line x1="364" y1="160" x2="384" y2="160"/>
    <line x1="532" y1="160" x2="552" y2="160"/>
    <line x1="700" y1="160" x2="720" y2="160"/>
  </g>
  <g fill="#8892E0">
    <polygon points="216,160 206,155 206,165"/>
    <polygon points="384,160 374,155 374,165"/>
    <polygon points="552,160 542,155 542,165"/>
    <polygon points="720,160 710,155 710,165"/>
  </g>

  <!-- Stage 1: Raw Source -->
  <g transform="translate(48, 92)">
    <rect x="0" y="0" width="148" height="136" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <rect x="12" y="12" width="6" height="112" rx="3" fill="#3B4CCA"/>
    <text x="32" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Raw Source</text>
    <text x="32" y="42" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">CSV / JSON / SCADA</text>
    <text x="32" y="66" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">Huawei CSV</text>
    <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">Enphase JSON</text>
    <text x="32" y="98" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">SCADA export</text>
    <rect x="32" y="110" width="104" height="20" rx="10" fill="#2A3390" stroke="#5C67DE" stroke-width="1"/>
    <text x="84" y="124" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#8892E0" letter-spacing="0.6">OEM-SPECIFIC</text>
  </g>

  <!-- Stage 2: Transform -->
  <g transform="translate(216, 92)">
    <rect x="0" y="0" width="148" height="136" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <rect x="12" y="12" width="6" height="112" rx="3" fill="#5C67DE"/>
    <text x="32" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Transform</text>
    <text x="32" y="66" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">source="huawei"</text>
    <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">source="enphase"</text>
    <text x="32" y="98" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">source="csv"</text>
    <rect x="32" y="110" width="104" height="20" rx="10" fill="#2A3390" stroke="#5C67DE" stroke-width="1"/>
    <text x="84" y="124" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#8892E0" letter-spacing="0.6">17+ OEM KEYS</text>
  </g>

  <!-- Stage 3: Validate -->
  <g transform="translate(384, 92)">
    <rect x="0" y="0" width="148" height="136" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <rect x="12" y="12" width="6" height="112" rx="3" fill="#5C67DE"/>
    <text x="32" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Validate</text>
    <text x="32" y="66" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">level="schema"</text>
    <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">level="semantic"</text>
    <text x="32" y="98" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">profile="bilateral"</text>
    <rect x="32" y="110" width="104" height="20" rx="10" fill="#2A3390" stroke="#5C67DE" stroke-width="1"/>
    <text x="84" y="124" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#8892E0" letter-spacing="0.6">ERRORS + WARNINGS</text>
  </g>

  <!-- Stage 4: Enrich -->
  <g transform="translate(552, 92)">
    <rect x="0" y="0" width="148" height="136" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <rect x="12" y="12" width="6" height="112" rx="3" fill="#7B86EE"/>
    <text x="32" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Enrich</text>
    <text x="32" y="66" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">context = {</text>
    <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">  seller, tariff,</text>
    <text x="32" y="98" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">  topology }</text>
    <rect x="32" y="110" width="104" height="20" rx="10" fill="#2A3390" stroke="#7B86EE" stroke-width="1"/>
    <text x="84" y="124" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#8892E0" letter-spacing="0.6">OPTIONAL</text>
  </g>

  <!-- Stage 5: Output -->
  <g transform="translate(720, 92)">
    <rect x="0" y="0" width="148" height="136" rx="12" fill="#0A0A0A" stroke="#7B86EE" stroke-width="1.5"/>
    <rect x="12" y="12" width="6" height="112" rx="3" fill="#FFFFFF"/>
    <text x="32" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Output</text>
    <text x="32" y="66" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">format=parquet</text>
    <text x="32" y="82" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">format=csv</text>
    <text x="32" y="98" font-family="'Courier New', Courier, monospace" font-size="10" fill="#C7CCF2">format=json</text>
    <rect x="32" y="110" width="104" height="20" rx="10" fill="#1F1F1F" stroke="#444444" stroke-width="1"/>
    <text x="84" y="124" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#C7CCF2" letter-spacing="0.6">FILE / STREAM</text>
  </g>

  <!-- Footer outputs note -->
  <text x="48" y="262" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">Each stage is independent and composable — skip enrichment if you don't need market context, or skip output if feeding records directly into your own analytics.</text>
</svg>