<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-label="ERP enrichment architecture: seven schemas linked by equipment_id, failure_code and part_id">
  <rect width="960" height="560" rx="16" fill="#4551BF"/>
  <text x="32" y="34" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">ERP ENRICHMENT ARCHITECTURE</text>
  <text x="32" y="50" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#C7CCF2">Seven schemas linked by three shared keys</text>
  <line x1="32" y1="60" x2="928" y2="60" stroke="#C7CCF2" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Equipment ID Map -->
  <g>
    <rect x="360" y="78" width="240" height="60" rx="12" fill="#2A3390" stroke="#7B86EE" stroke-width="1.5"/>
    <text x="480" y="102" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Equipment ID Map</text>
    <text x="480" y="120" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">identity linchpin</text>
  </g>

  <!-- fan-out lines -->
  <line x1="480" y1="138" x2="480" y2="168" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="168" x2="180" y2="168" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="168" x2="780" y2="168" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="500" y="162" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8892E0">equipment_id</text>
  <line x1="180" y1="168" x2="180" y2="188" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/><polygon points="180,188 175,179 185,179" fill="#8892E0"/>
  <line x1="480" y1="168" x2="480" y2="188" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/><polygon points="480,188 475,179 485,179" fill="#8892E0"/>
  <line x1="780" y1="168" x2="780" y2="188" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/><polygon points="780,188 775,179 785,179" fill="#8892E0"/>

  <!-- row 1 -->
  <g>
    <rect x="60" y="196" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="180" y="218" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Equipment Register</text>
    <text x="180" y="236" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">nameplate + asset context</text>
  </g>
  <g>
    <rect x="360" y="196" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="480" y="218" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Maintenance History</text>
    <text x="480" y="236" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">work orders</text>
  </g>
  <g>
    <rect x="660" y="196" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="780" y="218" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Alarm Frequency Profile</text>
    <text x="780" y="236" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">(derived)</text>
  </g>

  <!-- second fan-out from Maintenance History -->
  <line x1="480" y1="252" x2="480" y2="282" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="282" x2="260" y2="282" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="282" x2="700" y2="282" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="500" y="276" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8892E0">failure_code</text>
  <line x1="260" y1="282" x2="260" y2="300" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/><polygon points="260,300 255,291 265,291" fill="#8892E0"/>
  <line x1="700" y1="282" x2="700" y2="300" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/><polygon points="700,300 695,291 705,291" fill="#8892E0"/>

  <!-- row 2 -->
  <g>
    <rect x="140" y="308" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="260" y="330" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Failure Taxonomy</text>
    <text x="260" y="348" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">failure_code classes</text>
  </g>
  <g>
    <rect x="580" y="308" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="700" y="330" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Spare Parts</text>
    <text x="700" y="348" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">inventory</text>
  </g>

  <!-- part_id link -->
  <line x1="700" y1="364" x2="700" y2="392" stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="712" y="386" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8892E0">part_id</text>
  <polygon points="700,392 695,383 705,383" fill="#8892E0"/>

  <!-- Procurement Context -->
  <g>
    <rect x="580" y="400" width="240" height="56" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1"/>
    <text x="700" y="422" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Procurement Context</text>
    <text x="700" y="440" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">open POs + ETAs</text>
  </g>

  <!-- key legend -->
  <g>
    <rect x="60" y="480" width="380" height="56" rx="12" fill="#2A3390" stroke="#7B86EE" stroke-width="1"/>
    <text x="80" y="502" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#8892E0" letter-spacing="0.8">SHARED KEYS</text>
    <g font-family="'Courier New', Courier, monospace" font-size="11" fill="#FFFFFF">
      <text x="80" y="522">equipment_id</text>
      <text x="205" y="522">failure_code</text>
      <text x="320" y="522">part_id</text>
    </g>
  </g>
</svg>