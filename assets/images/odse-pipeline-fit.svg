<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%" role="img" aria-label="Where ODS-E fits: SCADA/OEM portal, extract, ODS-E pipeline, storage, analytics">
  <rect width="960" height="240" rx="16" fill="#4551BF"/>
  <text x="32" y="34" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">WHERE ODS-E FITS IN YOUR PIPELINE</text>
  <line x1="32" y1="46" x2="928" y2="46" stroke="#C7CCF2" stroke-opacity="0.3" stroke-width="1"/>

  <!-- connectors -->
  <g stroke="#8892E0" stroke-width="2.5" stroke-dasharray="4,3">
    <line x1="212" y1="130" x2="232" y2="130"/><line x1="388" y1="130" x2="408" y2="130"/>
    <line x1="564" y1="130" x2="584" y2="130"/><line x1="740" y1="130" x2="760" y2="130"/>
  </g>
  <g fill="#8892E0">
    <polygon points="232,130 223,125 223,135"/><polygon points="408,130 399,125 399,135"/>
    <polygon points="584,130 575,125 575,135"/><polygon points="760,130 751,125 751,135"/>
  </g>

  <!-- Stage 1: SCADA / OEM Portal -->
  <g>
    <rect x="48" y="70" width="164" height="120" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <text x="68" y="94" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">SCADA / OEM Portal</text>
    <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">
      <text x="68" y="120">FusionSolar</text><text x="68" y="136">Enlighten</text><text x="68" y="152">SolarEdge</text>
    </g>
  </g>

  <!-- Stage 2: Extract -->
  <g>
    <rect x="232" y="70" width="156" height="120" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <text x="252" y="94" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Extract (CSV/JSON)</text>
    <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">
      <text x="252" y="120">Scheduled API pulls</text><text x="252" y="136">FTP drops</text>
    </g>
  </g>

  <!-- Stage 3: ODS-E Pipeline (highlight) -->
  <g>
    <rect x="408" y="70" width="156" height="120" rx="12" fill="#2A3390" stroke="#7B86EE" stroke-width="1.5"/>
    <text x="428" y="94" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">ODS-E Pipeline</text>
    <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">
      <text x="428" y="120">Transform</text><text x="428" y="136">Validate</text><text x="428" y="152">Enrich</text>
    </g>
    <rect x="428" y="164" width="116" height="16" rx="8" fill="#1F1F1F" stroke="#444444" stroke-width="1"/>
    <text x="486" y="176" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" letter-spacing="0.6">THIS PACKAGE</text>
  </g>

  <!-- Stage 4: Store -->
  <g>
    <rect x="584" y="70" width="156" height="120" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <text x="604" y="94" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Store (Lake)</text>
    <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">
      <text x="604" y="120">Parquet</text><text x="604" y="136">S3 / GCS</text><text x="604" y="152">BigQuery</text>
    </g>
  </g>

  <!-- Stage 5: Analytics -->
  <g>
    <rect x="760" y="70" width="152" height="120" rx="12" fill="#2E378C" stroke="#5C67DE" stroke-width="1.2"/>
    <text x="780" y="94" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Analytics (BI / ML)</text>
    <g font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">
      <text x="780" y="120">PowerBI</text><text x="780" y="136">Jupyter</text><text x="780" y="152">dbt</text>
    </g>
  </g>

  <text x="48" y="218" font-family="'DM Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#C7CCF2">ODS-E handles the middle step: normalizing raw OEM data into a single schema, validating it, and writing it to storage.</text>
</svg>